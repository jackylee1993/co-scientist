# 快速演示目标：河流—河口—河岸带氮去除（教学示例）
# 完整版见 ../../assets/research_goal.example.yaml

title: 河流—河口—河岸带氮去除：选一条 8 周可验证的主线

question: >
  在 8 周、1 名研究生、现有培养/qPCR/同位素平台的约束下，
  哪条机制最可能解释河岸带与河口反硝化、厌氧氨氧化的耦合，
  并能用一个小规模实验区分至少两个竞争解释？

background: >
  天津地处海河流域下游，河流、河口、河岸带构成连续的氮迁移转化界面。
  已有工作覆盖来源解析、速率拆分和抗生素扰动，但田间尺度的耦合机制、
  恢复顺序和同位素诊断仍有争议。本次不新增大规模野外采样。

decision: 从 5 个候选方向中选 1 个作为 8 周主线，另选 1 个备选。

known:
  - 反硝化通常是河岸带/河口氮去除的主导过程，厌氧氨氧化贡献较小但不可忽略。
  - pH、DO、底物、C/N、温度、盐度会影响两条路径的相对贡献。
  - 土霉素等抗生素会抑制反硝化/厌氧氨氧化，并改变 nosZ、hzsB 等基因丰度。
  - δ15N/δ18O 可区分部分来源和过程，但存在分馏、混合和端元不确定性。

unknown:
  - 反硝化与厌氧氨氧化在田间尺度如何耦合？
  - 抗生素扰动后两条路径的恢复顺序是什么？
  - 同位素轨迹能否区分反硝化与亚硝酸盐氧化？
  - 河岸带/河口是否存在可识别的热点和阈值？
  - 来源解析与过程分馏如何解耦？

constraints:
  time: 8 周
  people: 1 名研究生主力；导师每周 1 小时
  data: 公开文献 + 课题组已有数据/archived samples；不新增野外采样
  equipment: 现有浆液培养、qPCR、同位素平台
  compute: 普通笔记本；不训练大模型
  budget: 小额耗材
  compliance: 未公开数据不上传；真实数据使用前分级、脱敏、确认边界

preferences:
  novelty_vs_feasibility: 平衡，略偏可行
  risk: 中
  output: 中文核心/SCI 初稿素材，或开题/基金素材

evaluation_criteria:
  - {name: novelty, weight: 0.20, rubric: "相对公开论文的具体增量；复刻/微调=1–3"}
  - {name: correctness, weight: 0.25, rubric: "机制自洽、证据支持、无致命漏洞"}
  - {name: testability, weight: 0.25, rubric: "8 周内能否清晰支持/反证；能否区分两个竞争解释"}
  - {name: impact, weight: 0.15, rubric: "对河流/河口氮管理或机制理解的价值"}
  - {name: feasibility, weight: 0.15, rubric: "样品、平台、人员、时间是否支持"}

non_goals:
  - 不分析原始色谱/质谱/qPCR 数据
  - 不生成真实实验结论
  - 不替代 PI 对研究方向的判断

safety:
  data_sensitivity: 内部/公开混合；未公开数据只在本地处理
  ethics: 不涉及人体/动物；野外采样按现有许可
  dual_use: 低
  notes: 抗生素实验按实验室生物安全规范执行。

deliverables:
  - 5–8 张假设卡
  - 锦标赛排序与评审摘要
  - 2–3 个进化候选
  - 一页纸研究方案

assumptions:
  - archived samples 足以支撑小规模补充实验；若不足，改为纯数据分析。
  - 公开文献可作为基线证据；新文献需检索并核验。

clarifying_questions:
  - archived samples 的站点、季节、保存条件是否足够？
  - 8 周内 qPCR/同位素平台可排期多少？
  - 本次优先发论文还是写基金？

stop_conditions:
  - 需要编造文献/数据
  - 8 周内无法做最小验证
  - 需要上传未公开数据
  - 连续两轮没有新证据
  - 触发伦理/生物安全红线
